<!-- About Section -->
<section id="about" class="py-20 bg-gray-950">
  <div class="container mx-auto px-6" [ngStyle]="getZoomStyle()">
    <div class="text-center mb-16">
      <h2 class="text-4xl md:text-5xl font-bold mb-4 gradient-text">About Me</h2>
      <p class="text-gray-400 max-w-2xl mx-auto">ca
        {{ aboutSubtitle }}
      </p>
    </div>

    <div class="grid md:grid-cols-2 gap-12 items-center">
      <div class="animate-slide-up">
        <div class="w-80 h-80 mx-auto bg-gradient-to-r from-primary to-accent rounded-full p-1">
          <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center">
            <div class="text-6xl">👨‍💻</div>
          </div>
        </div>
      </div>

      <div class="animate-slide-up">
        <h3 class="text-2xl font-bold mb-6">My Journey</h3>
        <p class="text-gray-300 mb-6 leading-relaxed">
          {{ journeyText }}
        </p>
        <p class="text-gray-300 mb-8 leading-relaxed">
          {{ passionText }}
        </p>

        <div class="grid grid-cols-2 gap-6">
          <div class="text-center">
            <div class="text-3xl font-bold text-primary">{{ stats.projects }}+</div>
            <div class="text-gray-400">Projects Completed</div>
          </div>
          <div class="text-center">
            <div class="text-3xl font-bold text-primary">{{ stats.experience }}+</div>
            <div class="text-gray-400">Years Experience</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
