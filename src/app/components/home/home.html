<!-- Hero Section -->
<section id="home" class="min-h-screen flex items-center justify-center relative overflow-hidden  ">
  <div class="container mx-auto px-6 text-center z-10" [ngStyle]="getTransformStyle()">
    <div class="animate-fade-in">
      <h1 class="text-5xl md:text-7xl font-bold mb-6">
        Hi, I'm <span class="gradient-name">{{ name }}</span>
      </h1>
      <p class="text-xl md:text-2xl text-gray-300 mb-8 max-w-3xl mx-auto">
        {{ description }}
      </p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="#projects" class="border border-primary text-primary hover:bg-secondary px-8 py-3 rounded-lg text-white font-medium transition-colors btn-primary animate-fade-in-up" style="animation-delay: 0.8s;">
          View My Work
        </a>
        <a href="#contact" class="border border-primary text-primar  hover:bg-secondary px-8 py-3 rounded-lg hover:text-white px-8 py-3 rounded-lg font-medium transition-colors btn-primary animate-fade-in-up" style="animation-delay: 1s;">
          Get In Touch
        </a>
      </div>
    </div>
  </div>

  <!-- Enhanced Floating Elements -->
  <div class="absolute top-20 left-10 w-20 h-20 bg-primary/20 rounded-full animate-bounce-slow float-animation"></div>
  <div class="absolute bottom-20 right-10 w-16 h-16 bg-accent/20 rounded-full animate-bounce-slow float-animation" style="animation-delay: 1s;"></div>
  <div class="absolute top-1/2 left-20 w-12 h-12 bg-blue-400/20 rounded-full float-animation" style="animation-delay: 2s;"></div>
  <div class="absolute bottom-1/3 right-20 w-8 h-8 bg-purple-400/20 rounded-full float-animation" style="animation-delay: 1.5s;"></div>
  <div class="absolute top-1/3 right-1/3 w-6 h-6 bg-green-400/20 rounded-full float-animation" style="animation-delay: 0.5s;"></div>
</section>
