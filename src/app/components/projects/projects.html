<!-- Projects Section -->
<section id="projects" class="py-20 bg-gray-950">
  <div class="container mx-auto px-6">
    <div class="text-center mb-16">
      <h2 class="text-4xl md:text-5xl font-bold mb-4 gradient-text">Featured Projects</h2>
      <p class="text-gray-400 max-w-2xl mx-auto">
        A showcase of my recent work and side projects.
      </p>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (project of projects; track project.id) {
        <div class="glass-effect rounded-xl overflow-hidden card-hover">
          <div class="h-48 flex items-center justify-center" [ngClass]="project.bgClass">
            <div class="text-6xl">{{ project.icon }}</div>
          </div>
          <div class="p-6">
            <h3 class="text-xl font-bold mb-3">{{ project.title }}</h3>
            <p class="text-gray-400 mb-4">
              {{ project.description }}
            </p>
            <div class="flex flex-wrap gap-2 mb-4">
              @for (tech of project.technologies; track tech.name) {
                <span [ngClass]="tech.bgClass" [class]="tech.textClass + ' px-3 py-1 rounded-full text-sm'">
                  {{ tech.name }}
                </span>
              }
            </div>
            <div class="flex space-x-4">
              <a [href]="project.demoUrl" class="text-primary hover:text-secondary transition-colors">Live Demo</a>
              <a [href]="project.githubUrl" class="text-gray-400 hover:text-white transition-colors">GitHub</a>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
